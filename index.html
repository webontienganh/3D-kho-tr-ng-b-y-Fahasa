    /* =========================================================================
       3. LOCALSTORAGE & UTILITY FUNCTIONS

    function loadPersistedData() {
      try {
        const savedSpeaking = localStorage.getItem(STORAGE_KEYS.SPEAKING_SCORES);
        if (savedSpeaking) state.speakingScores = JSON.parse(savedSpeaking);

        const savedSpeakingParts = localStorage.getItem(STORAGE_KEYS.SPEAKING_PART_SCORES);
        if (savedSpeakingParts) state.speakingPartScores = JSON.parse(savedSpeakingParts);

        const savedReading = localStorage.getItem(STORAGE_KEYS.READING_TESTS);
        if (savedReading) READING_TESTS = JSON.parse(savedReading);

        const savedListening = localStorage.getItem(STORAGE_KEYS.LISTENING_TESTS);
        if (savedListening) LISTENING_TESTS = JSON.parse(savedListening);

        const savedQuizScores = localStorage.getItem(STORAGE_KEYS.QUIZ_SCORES);
        if (savedQuizScores) state.quizScores = JSON.parse(savedQuizScores);

        const savedSettings = localStorage.getItem(STORAGE_KEYS.SETTINGS);
        if (savedSettings) {
          const parsed = JSON.parse(savedSettings);
          if (typeof parsed.soundEffects === 'boolean') state.soundEffects = parsed.soundEffects;
          if (typeof parsed.selectedVoiceURI === 'string') state.selectedVoiceURI = parsed.selectedVoiceURI;
          if (typeof parsed.speechRate === 'number') state.speechRate = parsed.speechRate;
          if (typeof parsed.part1RandomCount === 'number') state.part1RandomCount = parsed.part1RandomCount;
          if (typeof parsed.shufflePassageQuestions === 'boolean') state.shufflePassageQuestions = parsed.shufflePassageQuestions;
          if (typeof parsed.shuffleReadingOptions === 'boolean') state.shuffleReadingOptions = parsed.shuffleReadingOptions;
          if (typeof parsed.shuffleListeningQuestions === 'boolean') state.shuffleListeningQuestions = parsed.shuffleListeningQuestions;
          if (typeof parsed.shuffleListeningOptions === 'boolean') state.shuffleListeningOptions = parsed.shuffleListeningOptions;
        }
      } catch (err) {
        console.warn('Could not load localStorage:', err);
      }
    }

    function shuffleQuestionOptions(question) {
      // Letter references depend on the original positions of the choices.
      const letterReference = /^(?:both\s+)?[a-d]\s*(?:and|or|&)\s*[a-d](?:\s+(?:together|are correct))?\.?$/i;
      if (question.options.some(option => letterReference.test(option.trim()))) return question;

      const anchoredOption = /^(?:none of the above(?: is correct)?|all of the above(?: are correct)?|all of these)\.?$/i;
      const movableIndices = question.options.flatMap((option, index) =>
        option.trim() && !anchoredOption.test(option.trim()) ? [index] : []
      );
      const shuffledIndices = shuffleArray(movableIndices);
      const optionOrder = question.options.map((_, index) => index);
      movableIndices.forEach((index, position) => {
        optionOrder[index] = shuffledIndices[position];
      });

      return {
        ...question,
        options: optionOrder.map(index => question.options[index]),
        ...(question.translation && {
          translation: {
            ...question.translation,
            options: optionOrder.map(index => question.translation.options[index])
          }
        }),
        answer: optionOrder.indexOf(question.answer)
      };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(totalSeconds) {
      const safe = Math.max(0, Math.floor(totalSeconds));
      const mins = Math.floor(safe / 60);
      const secs = safe % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatScore(num) {
      if (typeof num !== 'number' || Number.isNaN(num)) return '0';
      return Number.isInteger(num) ? String(num) : num.toFixed(1);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

        test.part1.forEach(q => {

        });
      });
      return all;
    }

    /* =========================================================================
       4. WEB AUDIO API SOUND EFFECTS (NO EXTERNAL AUDIO FILES)
       ========================================================================= */

    let audioCtx = null;

    function playSound(type) {
      if (!state.soundEffects) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.06);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.07);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'forgot') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.14);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'complete') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.42);
        }
      } catch (e) {}
    }

    function toggleSoundEffects() {
      state.soundEffects = !state.soundEffects;
      saveSettings();
      updateSfxUI();
      if (state.soundEffects) playSound('click');
      showToast(state.soundEffects ? 'Đã bật hiệu ứng âm thanh' : 'Đã tắt hiệu ứng âm thanh', 'info');
    }

    function updateSfxUI() {
      const icon = document.getElementById('sfx-icon');
      const label = document.getElementById('sfx-label');
      if (icon) icon.textContent = state.soundEffects ? '🔊' : '🔇';
      if (label) label.textContent = state.soundEffects ? 'Âm thanh: Bật' : 'Âm thanh: Tắt';
    }

    /* =========================================================================
       5. WEB SPEECH API (EXAMINER VOICE)
       ========================================================================= */

    let availableEnglishVoices = [];
    let isExaminerSpeaking = false;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const enVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      availableEnglishVoices = enVoices.length > 0 ? enVoices : voices;

      if (!state.selectedVoiceURI && availableEnglishVoices.length > 0) {
        const preferred =
          availableEnglishVoices.find(v => v.lang === 'en-GB' && v.name.includes('Google')) ||
          availableEnglishVoices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
          availableEnglishVoices.find(v => v.lang.startsWith('en')) ||
          availableEnglishVoices[0];
        if (preferred) state.selectedVoiceURI = preferred.voiceURI;
      }

      populateVoiceSelect(document.getElementById('voice-select'));
      populateVoiceSelect(document.getElementById('exam-voice-select'));
    }

    function populateVoiceSelect(selectEl) {
      if (!selectEl) return;
      if (availableEnglishVoices.length === 0) {
        selectEl.innerHTML = `<option value="">Giọng đọc mặc định trình duyệt</option>`;
        return;
      }
      selectEl.innerHTML = availableEnglishVoices.map(v => `
        <option value="${escapeHtml(v.voiceURI)}" ${v.voiceURI === state.selectedVoiceURI ? 'selected' : ''}>
          ${escapeHtml(v.name)} (${escapeHtml(v.lang)})
        </option>
      `).join('');
    }

    function setSelectedVoice(uri) {
      state.selectedVoiceURI = uri;
      saveSettings();
    }

    function setSpeechRate(rate) {
      const parsed = parseFloat(rate);
      if (!Number.isNaN(parsed)) {
        state.speechRate = parsed;
        saveSettings();
      }
    }

    function setExaminerSpeakingVisual(active) {
      isExaminerSpeaking = active;
      const wave = document.getElementById('examiner-wave');
      const statusText = document.getElementById('examiner-status-text');
      if (wave) {
        if (active) wave.classList.add('speaking-active');
        else wave.classList.remove('speaking-active');
      }
      if (statusText) {
        statusText.textContent = active ? 'Giám thị đang đọc câu hỏi...' : 'Giám thị đã đọc xong — Mời bạn trả lời';
      }
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
      setExaminerSpeakingVisual(false);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        showToast('Trình duyệt của bạn không hỗ trợ đọc giọng nói.', 'warn');
        return;
      }
      stopSpeaking();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = state.speechRate || 0.95;

      const voice = availableEnglishVoices.find(v => v.voiceURI === state.selectedVoiceURI);
      if (voice) {
        utterance.voice = voice;
        utterance.lang = voice.lang || 'en-US';
      }

      utterance.onstart = () => setExaminerSpeakingVisual(true);
      utterance.onend = () => setExaminerSpeakingVisual(false);
      utterance.onerror = () => setExaminerSpeakingVisual(false);

      window.speechSynthesis.speak(utterance);
    }

    function testExaminerVoice() {
      speakText('Hello! Welcome to the B1 English Speaking Test. Are you ready?');
    }

    /* =========================================================================
       6. TOAST NOTIFICATIONS & CUSTOM MODAL (NO ALERT / CONFIRM)
       ========================================================================= */

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colors = {
        info: 'bg-white border-pastelBlue-200 text-slate-700',
        success: 'bg-pastelMint-50 border-pastelMint-300 text-emerald-800',
        warn: 'bg-pastelPink-50 border-pastelPink-300 text-rose-800'
      };
      const icons = { info: '💡', success: '✅', warn: '⚠️' };

      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-soft text-xs sm:text-sm font-bold flex items-center gap-2.5 animate-fade-up ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${icons[type] || '💡'}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3200);
    }

    function openModal(innerHtml, maxWidthClass = 'max-w-lg') {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.innerHTML = `
        <div class="bg-white rounded-3xl w-full ${maxWidthClass} max-h-[90vh] flex flex-col overflow-hidden border border-slate-100 shadow-2xl animate-fade-up">
          ${innerHtml}
        </div>
      `;
      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';
    }

    let pendingModalConfirm = null;

    function showConfirmModal({ title, message, confirmText = 'Xác nhận', danger = false, onConfirm }) {
      pendingModalConfirm = onConfirm;
      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-display font-bold text-lg text-slate-800">${escapeHtml(title)}</h3>
          <p class="text-sm text-slate-600 leading-relaxed">${escapeHtml(message)}</p>
          <div class="flex items-center justify-end gap-2.5 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">Hủy</button>
            <button onclick="executePendingModalConfirm()" class="px-5 py-2 rounded-xl text-sm font-bold text-white shadow-sm transition ${danger ? 'bg-rose-500 hover:bg-rose-600' : 'bg-sky-500 hover:bg-sky-600'}">
              ${escapeHtml(confirmText)}
            </button>
          </div>
        </div>
      `, 'max-w-md');
    }

    function executePendingModalConfirm() {
      const fn = pendingModalConfirm;
      pendingModalConfirm = null;
      closeModal();
      if (typeof fn === 'function') fn();
    }

          confirmText: 'Rời phòng thi',
          danger: true,
          onConfirm: () => {
            cleanupActiveSessions();
            renderApp();
          }
        });

        cleanupActiveSessions();
        renderApp();
      }

    function switchTab(tab) {
      if (state.activeTab === tab && !state.speakingExam && !state.activeQuiz) return;

      const isInRunningSession =
        (state.speakingExam && state.speakingExam.mode === 'running') ||
        (state.activeQuiz && !state.activeQuiz.submitted);

      if (isInRunningSession) {
        showConfirmModal({
          title: 'Chuyển sang kỹ năng khác?',
          message: 'Bạn đang làm bài thi dở dang. Chuyển tab sẽ hủy phiên thi hiện tại.',

          onConfirm: () => {
            cleanupActiveSessions();
            state.activeTab = tab;
            playSound('click');
            renderApp();
          }

                      </span>
                      <button onclick="startSpeakingExam(${test.id})" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pastelPink-300 to-pastelBlue-300 hover:from-pastelPink-400 hover:to-pastelBlue-400 text-slate-800 hover:text-white text-xs sm:text-sm font-bold shadow-sm transition-all">

      populateVoiceSelect(document.getElementById('voice-select'));
    }

    /* =========================================================================
       9. TAB 1: SPEAKING EXAM SIMULATOR LOGIC (FULL, PART, & RANDOM MODES)
       ========================================================================= */

    function startSpeakingExam(testId, isRandomMode = false) {
      const test = SPEAKING_TESTS.find(t => t.id === testId);
      if (!test) return;

      cleanupActiveSessions();
      playSound('click');

      state.speakingExam = {
        sessionType: 'full',
        sourceTestId: test.id,
        targetPart: null,
        sessionTitle: isRandomMode ? '🎲 ĐỀ NGẪU NHIÊN (Ẩn số đề)' : test.title,
        isRandomMode: Boolean(isRandomMode),
        part1Pool: test.part1.map(q => ({ text: q, sourceTestId: test.id })),
        part2Data: { text: test.part2, sourceTestId: test.id },
        part3Data: { topic: test.part3Topic, questions: [...test.part3Questions], sourceTestId: test.id },
        mode: 'running',
        part: 1,
        stepIndex: 0,
        timeRemaining: PART_DURATIONS[1],
        isPaused: false,
        timerId: null,
        results: [],
        reviewFilter: 'all'
      };

      renderApp();
      startSpeakingTimer();
      speakCurrentExamPrompt();
    }

    function startRandomSpeakingExam() {
      const randomIdx = Math.floor(Math.random() * SPEAKING_TESTS.length);
      const chosenTest = SPEAKING_TESTS[randomIdx];
      if (!chosenTest) return;
      startSpeakingExam(chosenTest.id, true);
      showToast('Đã bốc ngẫu nhiên 1 đề! Số đề sẽ được tiết lộ sau khi hoàn thành.', 'info');
    }

    function startSpeakingTestPart(testId, partNumber) {
      const test = SPEAKING_TESTS.find(t => t.id === testId);
      const part = Number(partNumber);
      if (!test || ![1, 2, 3].includes(part)) return;

      cleanupActiveSessions();
      playSound('click');

      const partMinutes = { 1: 3, 2: 4, 3: 5 };
      state.speakingExam = {
        sessionType: 'test-part',
        sourceTestId: test.id,
        targetPart: part,
        sessionTitle: `SPEAKING TEST ${test.id} • Part ${part} (${partMinutes[part]} phút)`,
        isRandomMode: false,
        part1Pool: part === 1 ? test.part1.map(q => ({ text: q, sourceTestId: test.id })) : [],
        part2Data: part === 2 ? { text: test.part2, sourceTestId: test.id } : null,
        part3Data: part === 3 ? { topic: test.part3Topic, questions: [...test.part3Questions], sourceTestId: test.id } : null,
        mode: 'running',
        part,
        stepIndex: 0,
        timeRemaining: PART_DURATIONS[part],
        isPaused: false,
        timerId: null,
        results: [],
        reviewFilter: 'all'
      };

      renderApp();
      startSpeakingTimer();
      speakCurrentExamPrompt();
      showToast(`Bắt đầu luyện Speaking Test ${test.id} — Part ${part} (${partMinutes[part]} phút)!`, 'info');
    }

    function startPart1RandomSession(customCount) {
      const count = Math.min(60, Math.max(1, parseInt(customCount || state.part1RandomCount, 10) || 6));
      state.part1RandomCount = count;
      saveSettings();

      const shuffled = shuffleArray(getAllPart1Questions()).slice(0, count);
      cleanupActiveSessions();
      playSound('click');

      state.speakingExam = {
        sessionType: 'part1',
        sourceTestId: null,
        targetPart: 1,
        sessionTitle: `🎲 RANDOM PART 1 (${count} câu xáo ngẫu nhiên)`,
        isRandomMode: true,
        part1Pool: shuffled,
        part2Data: null,
        part3Data: null,
        mode: 'running',
        part: 1,
        stepIndex: 0,
        timeRemaining: count * 30,
        isPaused: false,
        timerId: null,
        results: [],
        reviewFilter: 'all'
      };

      renderApp();
      startSpeakingTimer();
      speakCurrentExamPrompt();
    }

    function startPart2RandomSession() {
      const test = SPEAKING_TESTS[Math.floor(Math.random() * SPEAKING_TESTS.length)];
      if (!test) return;

      cleanupActiveSessions();
      playSound('click');

      state.speakingExam = {
        sessionType: 'part2',
        sourceTestId: test.id,
        targetPart: 2,
        sessionTitle: '🎲 RANDOM PART 2 (Ẩn số đề)',
        isRandomMode: true,
        part1Pool: [],
        part2Data: { text: test.part2, sourceTestId: test.id },
        part3Data: null,
        mode: 'running',
        part: 2,
        stepIndex: 0,
        timeRemaining: PART_DURATIONS[2],
        isPaused: false,
        timerId: null,
        results: [],
        reviewFilter: 'all'
      };

      renderApp();
      startSpeakingTimer();
      speakCurrentExamPrompt();
    }

    function startPart3RandomSession() {
      const test = SPEAKING_TESTS[Math.floor(Math.random() * SPEAKING_TESTS.length)];
      if (!test) return;

      cleanupActiveSessions();
      playSound('click');

      state.speakingExam = {
        sessionType: 'part3',
        sourceTestId: test.id,
        targetPart: 3,
        sessionTitle: '🎲 RANDOM PART 3 (Ẩn số đề)',
        isRandomMode: true,
        part1Pool: [],
        part2Data: null,
        part3Data: { topic: test.part3Topic, questions: [...test.part3Questions], sourceTestId: test.id },
        mode: 'running',
        part: 3,
        stepIndex: 0,
        timeRemaining: PART_DURATIONS[3],
        isPaused: false,
        timerId: null,
        results: [],
        reviewFilter: 'all'
      };

      renderApp();
      startSpeakingTimer();
      speakCurrentExamPrompt();
    }

    function startMixedThreePartsExam() {
      const p1Shuffled = shuffleArray(getAllPart1Questions()).slice(0, 6);
      const t2 = SPEAKING_TESTS[Math.floor(Math.random() * SPEAKING_TESTS.length)];
      const t3 = SPEAKING_TESTS[Math.floor(Math.random() * SPEAKING_TESTS.length)];

      cleanupActiveSessions();
      playSound('click');

      state.speakingExam = {
        sessionType: 'mix',
        sourceTestId: null,
        targetPart: null,
        sessionTitle: '🔀 MIX 3 PART NGẪU NHIÊN (12 phút)',
        isRandomMode: true,
        part1Pool: p1Shuffled,
        part2Data: { text: t2.part2, sourceTestId: t2.id },
        part3Data: { topic: t3.part3Topic, questions: [...t3.part3Questions], sourceTestId: t3.id },
        mode: 'running',
        part: 1,
        stepIndex: 0,
        timeRemaining: PART_DURATIONS[1],
        isPaused: false,
        timerId: null,
        results: [],
        reviewFilter: 'all'
      };

      renderApp();
      startSpeakingTimer();
      speakCurrentExamPrompt();
    }

    function restartCurrentSpeakingSession() {
      const exam = state.speakingExam;
      if (!exam) return;
      if (exam.sessionType === 'test-part') {
        startSpeakingTestPart(exam.sourceTestId, exam.targetPart);
      } else if (exam.sessionType === 'part1') {
        startPart1RandomSession(exam.part1Pool.length);
      } else if (exam.sessionType === 'part2') {
        startPart2RandomSession();
      } else if (exam.sessionType === 'part3') {
        startPart3RandomSession();
      } else if (exam.sessionType === 'mix') {
        startMixedThreePartsExam();
      } else if (exam.isRandomMode) {
        startRandomSpeakingExam();
      } else {
        startSpeakingExam(exam.sourceTestId, false);
      }
    }

    function startSpeakingTimer() {
      const exam = state.speakingExam;
      if (!exam) return;
      if (exam.timerId) clearInterval(exam.timerId);

      exam.timerId = setInterval(() => {
        if (!state.speakingExam || state.speakingExam.mode !== 'running' || state.speakingExam.isPaused) return;

        if (state.speakingExam.timeRemaining > 0) {
          state.speakingExam.timeRemaining--;
          const timerEl = document.getElementById('exam-timer-display');
          if (timerEl) {
            timerEl.textContent = formatTime(state.speakingExam.timeRemaining);
            if (state.speakingExam.timeRemaining <= 30) {
              timerEl.classList.add('text-rose-500');
            } else {
              timerEl.classList.remove('text-rose-500');
            }
          }
          if (state.speakingExam.timeRemaining === 0) {
            showToast(`Hết thời gian Part ${state.speakingExam.part}!`, 'warn');
          }
        }
      }, 1000);
    }

    function toggleSpeakingPause() {
      if (!state.speakingExam || state.speakingExam.mode !== 'running') return;
      state.speakingExam.isPaused = !state.speakingExam.isPaused;
      if (state.speakingExam.isPaused) stopSpeaking();
      playSound('click');
      renderApp();
    }

    function getCurrentSpeakingItem() {
      const exam = state.speakingExam;
      if (!exam) return null;

      if (exam.part === 1) {
        const qObj = exam.part1Pool[exam.stepIndex];
        if (!qObj) return null;
        return {
          part: 1,
          label: `Part 1 — Câu hỏi ${exam.stepIndex + 1}/${exam.part1Pool.length}`,
          text: qObj.text,
          sourceTestId: qObj.sourceTestId,
          isHidden: true,
          points: 0.5,
          badgeText: 'Ẩn câu hỏi • Nghe giám thị đọc & trả lời'
        };
      }
      if (exam.part === 2 && exam.part2Data) {
        return {
          part: 2,
          label: 'Part 2 — Solution Discussion (Tình huống)',
          text: exam.part2Data.text,
          sourceTestId: exam.part2Data.sourceTestId,
          isHidden: false,
          points: 3.0,
          badgeText: 'Hiển thị đề bài • 3.0 điểm'
        };
      }
      if (exam.part === 3 && exam.part3Data) {
        if (exam.stepIndex === 0) {
          return {
            part: 3,
            label: 'Part 3 — Topic Development (Chủ đề chính)',
            text: exam.part3Data.topic,
            sourceTestId: exam.part3Data.sourceTestId,
            isHidden: false,
            points: 2.5,
            badgeText: 'Hiển thị chủ đề • 2.5 điểm'
          };
        }
        const followIdx = exam.stepIndex - 1;
        return {
          part: 3,
          label: `Part 3 — Câu hỏi phụ ${followIdx + 1}/3`,
          text: exam.part3Data.questions[followIdx],
          sourceTestId: exam.part3Data.sourceTestId,
          isHidden: true,
          points: 0.5,
          badgeText: 'Ẩn câu hỏi phụ • Nghe giám thị đọc (0.5 điểm)'
        };
      }
      return null;
    }

    function speakCurrentExamPrompt() {
      const item = getCurrentSpeakingItem();
      if (!item) return;
      speakText(item.text);
    }

    function getCurrentSpeakingScore() {
      if (!state.speakingExam) return 0;
      return state.speakingExam.results.reduce((sum, r) => sum + r.earnedScore, 0);
    }

    function getSpeakingSessionMaxScore() {
      const exam = state.speakingExam;
      if (!exam) return 10;
      if (exam.sessionType === 'test-part') {
        if (exam.targetPart === 1) return 3.0;
        if (exam.targetPart === 2) return 3.0;
        if (exam.targetPart === 3) return 4.0;
      }
      if (exam.sessionType === 'part1') return exam.part1Pool.length * 0.5;
      if (exam.sessionType === 'part2') return 3.0;
      if (exam.sessionType === 'part3') return 4.0;
      return 10.0;
    }

    function recordSpeakingAnswer(remembered) {
      const exam = state.speakingExam;
      if (!exam || exam.mode !== 'running') return;

      stopSpeaking();
      const item = getCurrentSpeakingItem();
      if (!item) return;

      playSound(remembered ? 'success' : 'forgot');

      exam.results.push({
        part: item.part,
        label: item.label,
        text: item.text,
        sourceTestId: item.sourceTestId,
        maxScore: item.points,
        earnedScore: remembered ? item.points : 0,
        status: remembered ? 'remembered' : 'forgot'
      });

      // Advance step depending on sessionType
      if (exam.part === 1) {
        if (exam.stepIndex < exam.part1Pool.length - 1) {
          exam.stepIndex++;
        } else if (exam.sessionType === 'part1' || exam.sessionType === 'test-part') {
          finishSpeakingExam();
          return;
        } else {
          exam.part = 2;
          exam.stepIndex = 0;
          exam.timeRemaining = PART_DURATIONS[2];
          showToast('Chuyển sang Part 2: Solution Discussion (4 phút)', 'info');
        }
      } else if (exam.part === 2) {
        if (exam.sessionType === 'part2' || exam.sessionType === 'test-part') {
          finishSpeakingExam();
          return;
        } else {
          exam.part = 3;
          exam.stepIndex = 0;
          exam.timeRemaining = PART_DURATIONS[3];
          showToast('Chuyển sang Part 3: Topic Development (5 phút)', 'info');
        }
      } else if (exam.part === 3) {
        if (exam.stepIndex < 3) {
          exam.stepIndex++;
        } else {
          finishSpeakingExam();
          return;
        }
      }

      renderApp();
      speakCurrentExamPrompt();
    }

    function finishSpeakingExam() {
      const exam = state.speakingExam;
      if (!exam) return;

      stopSpeaking();
      if (exam.timerId) clearInterval(exam.timerId);
      exam.mode = 'result';

      const totalScore = getCurrentSpeakingScore();

      // Save best score for full test (Test 1..10) without overwriting with single-part scores
      if (exam.sessionType === 'full' && exam.sourceTestId) {
        const prev = state.speakingScores[exam.sourceTestId];
        state.speakingScores[exam.sourceTestId] = {
          latest: totalScore,
          best: prev ? Math.max(prev.best, totalScore) : totalScore,
          date: new Date().toISOString()
        };
        saveSpeakingScores();
      } else if (exam.sessionType === 'test-part' && exam.sourceTestId && exam.targetPart) {
        const key = `${exam.sourceTestId}_${exam.targetPart}`;
        const prevPart = state.speakingPartScores[key];
        state.speakingPartScores[key] = {
          latest: totalScore,
          best: prevPart ? Math.max(prevPart.best, totalScore) : totalScore,
          max: getSpeakingSessionMaxScore(),
          date: new Date().toISOString()
        };
        saveSpeakingPartScores();
      }

      playSound('complete');
      renderApp();
    }

          <div class="grid grid-cols-1 ${visibleParts.length > 1 ? 'sm:grid-cols-3' : ''} gap-2.5">

    function setSpeakingReviewFilter(filter) {
      if (!state.speakingExam) return;
      state.speakingExam.reviewFilter = filter;
      renderApp();
    }

    function renderSpeakingResultView(root) {
      const exam = state.speakingExam;
      const totalScore = getCurrentSpeakingScore();
      const maxScore = getSpeakingSessionMaxScore();
      const results = exam.results;
      const forgotCount = results.filter(r => r.status === 'forgot').length;
      const rememberedCount = results.filter(r => r.status === 'remembered').length;

      const filteredResults = exam.reviewFilter === 'forgot'
        ? results.filter(r => r.status === 'forgot')
        : results;

      let revealBanner = '';
      if (exam.isRandomMode) {
        if (exam.sourceTestId) {
          revealBanner = `
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-pastelBlue-50 border border-pastelBlue-200 text-sky-800 text-xs sm:text-sm font-extrabold">
              <span>🎯 Tiết lộ đề ngẫu nhiên:</span>
              <span>SPEAKING TEST ${exam.sourceTestId}</span>
            </div>
          `;
        } else {
          const uniqueSources = [...new Set(results.map(r => r.sourceTestId).filter(Boolean))].sort((a, b) => a - b);
          revealBanner = `
            <div class="inline-flex flex-wrap items-center justify-center gap-1.5 px-4 py-1.5 rounded-full bg-pastelBlue-50 border border-pastelBlue-200 text-sky-800 text-xs font-extrabold">
              <span>🎯 Nguồn câu hỏi được trộn từ:</span>
              <span>${uniqueSources.map(id => `Test ${id}`).join(', ')}</span>
            </div>
          `;
        }
      }

      root.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-6 animate-fade-up">
          <!-- Summary Score Card -->
          <div class="bg-gradient-to-br from-pastelPink-50 via-white to-pastelBlue-50 rounded-3xl p-6 sm:p-8 border border-white shadow-soft text-center space-y-4">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white border border-slate-200 text-xs font-extrabold text-slate-600">
              <span>🏆</span><span>Hoàn thành bài thi Speaking</span>
            </div>

            <h2 class="font-display font-bold text-2xl sm:text-3xl text-slate-800">${escapeHtml(exam.sessionTitle)}</h2>
            ${revealBanner}

            <!-- Big Score Display -->
            <div class="py-2">
              <div class="inline-flex items-baseline gap-1 px-8 py-4 rounded-3xl bg-white border border-pastelMint-200 shadow-card">
                <span class="font-display font-extrabold text-4xl sm:text-5xl text-emerald-600">${formatScore(totalScore)}</span>
                <span class="font-display font-bold text-lg text-slate-400">/ ${formatScore(maxScore)} điểm</span>
              </div>
            </div>

            <!-- Stats Badges -->
            <div class="flex flex-wrap items-center justify-center gap-3 text-xs sm:text-sm font-bold">
              <span class="px-3.5 py-1.5 rounded-xl bg-pastelMint-50 border border-pastelMint-200 text-emerald-700">
                ✅ Đã thuộc: ${rememberedCount} phần/câu
              </span>
              <span class="px-3.5 py-1.5 rounded-xl bg-pastelPink-50 border border-pastelPink-200 text-rose-700">
                ❌ Quên: ${forgotCount} phần/câu
              </span>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              <button onclick="restartCurrentSpeakingSession()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-pastelPink-400 to-pastelBlue-400 hover:from-pastelPink-500 hover:to-pastelBlue-500 text-white text-sm font-bold shadow-sm transition">
                ${exam.isRandomMode ? '🎲 Random phiên mới' : (exam.sessionType === 'test-part' ? '🔄 Làm lại Part này' : '🔄 Làm lại đề này')}
              </button>
              ${exam.sessionType === 'test-part' && exam.sourceTestId ? `
                <button onclick="startSpeakingExam(${exam.sourceTestId}, false)" class="px-5 py-2.5 rounded-xl bg-pastelMint-100 hover:bg-pastelMint-200 border border-pastelMint-300/80 text-emerald-800 text-sm font-bold shadow-sm transition">
                  🚀 Làm Full đề này (12')
                </button>
              ` : ''}
              <button onclick="cleanupActiveSessions(); renderApp();" class="px-5 py-2.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-sm font-bold transition">
                ← Quay lại trang Nói
              </button>
            </div>
          </div>

          <!-- Full Review List (Revealing all hidden texts + source Test number) -->
          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-100 shadow-card space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
              <div>
                <h3 class="font-display font-bold text-lg text-slate-800">Chi tiết toàn bộ câu hỏi & nguồn đề</h3>
                <p class="text-xs text-slate-500">Các câu hỏi bị ẩn trong lúc thi và số hiệu Test gốc nay đã được hiển thị đầy đủ.</p>
              </div>
              <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl self-start">
                <button onclick="setSpeakingReviewFilter('all')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${exam.reviewFilter === 'all' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                  Tất cả (${results.length})
                </button>
                <button onclick="setSpeakingReviewFilter('forgot')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${exam.reviewFilter === 'forgot' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                  Câu bị quên (${forgotCount})
                </button>
              </div>
            </div>

            ${filteredResults.length === 0 ? `
              <div class="py-10 text-center space-y-2">
                <div class="text-3xl">🎉</div>
                <p class="font-bold text-slate-700">Tuyệt vời! Bạn không quên câu hỏi nào trong phiên này.</p>
              </div>
            ` : `
              <div class="space-y-3">
                ${filteredResults.map((r, idx) => {
                  const isRemembered = r.status === 'remembered';
                  const encodedText = encodeURIComponent(r.text);
                  return `
                    <div class="rounded-2xl p-4 border ${isRemembered ? 'bg-pastelMint-50/40 border-pastelMint-200/80' : 'bg-pastelPink-50/50 border-pastelPink-200/80'} flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div class="space-y-1 flex-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="text-xs font-extrabold text-slate-500">${escapeHtml(r.label)}</span>
                          ${r.sourceTestId ? `<span class="px-2 py-0.5 rounded-full bg-white border border-slate-200 text-slate-600 text-[11px] font-bold">Nguồn: Test ${r.sourceTestId}</span>` : ''}
                          <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${isRemembered ? 'bg-pastelMint-100 text-emerald-700' : 'bg-pastelPink-100 text-rose-700'}">
                            ${isRemembered ? `Đã thuộc (+${r.maxScore}đ)` : 'Quên (0đ)'}
                          </span>
                        </div>
                        <p class="text-sm sm:text-base font-semibold text-slate-800 leading-relaxed">${escapeHtml(r.text)}</p>
                      </div>
                      <button onclick="speakText(decodeURIComponent('${encodedText}'))" class="self-start sm:self-center shrink-0 px-3 py-2 rounded-xl bg-white hover:bg-pastelBlue-50 border border-slate-200 text-xs font-bold text-sky-700 transition flex items-center gap-1.5">
                        <span>🔊</span><span>Nghe</span>
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    /* =========================================================================
       11. TABS 2 & 3: READING & LISTENING — PASSAGE-BASED + TEST MANAGER
       ========================================================================= */

    function getTestsForSkill(skill) {
      return skill === 'reading' ? [...BUILTIN_READING_TESTS, ...READING_TESTS] : [...BUILTIN_LISTENING_TESTS, ...LISTENING_TESTS];
    }

    function renderSkillDashboard(root, skill) {
      const isReading = skill === 'reading';
      const label = isReading ? 'Đọc (Reading)' : 'Nghe (Listening)';
      const shortName = isReading ? 'Đọc' : 'Nghe';
      const skillName = isReading ? 'Reading' : 'Listening';
      const questionSetting = isReading ? 'shufflePassageQuestions' : 'shuffleListeningQuestions';
      const optionSetting = isReading ? 'shuffleReadingOptions' : 'shuffleListeningOptions';
      const icon = isReading ? '📖' : '🎧';
      const tests = getTestsForSkill(skill);

      root.innerHTML = `
        <div class="space-y-6 animate-fade-up">
          <!-- Header Banner -->
          <div class="bg-gradient-to-r ${isReading ? 'from-pastelBlue-50 via-white to-pastelPink-50' : 'from-pastelPink-50 via-white to-pastelBlue-50'} rounded-3xl p-6 border border-white shadow-soft flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div class="space-y-1.5">
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white border border-slate-200/80 text-xs font-bold text-slate-600">
                <span>${icon}</span><span>Trắc nghiệm kỹ năng ${label}</span>
              </div>
              <h2 class="font-display font-bold text-2xl text-slate-800">Danh sách đề thi ${shortName}</h2>
              <p class="text-sm text-slate-500">
                ${isReading
                  ? 'Mỗi đề gồm 4 Passage (mỗi Passage 10 câu). Có thể luyện từng Passage, làm trọn một đề hoặc làm tất cả bộ đề.'
                  : 'Có thể luyện từng Part, làm trọn một đề hoặc làm tất cả bộ đề.'}
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5 self-start lg:self-center">
                ${tests.length ? `
                  <button type="button" onclick="startSkillQuiz('${skill}')" class="px-4 py-2.5 rounded-2xl bg-pastelBlue-100 hover:bg-pastelBlue-200 text-sky-800 text-xs sm:text-sm font-bold transition">
                    Làm tất cả ${skillName} (${tests.length} bộ)
                  </button>
                ` : ''}
                <button type="button" onclick="toggleQuizShuffle('${questionSetting}')" aria-pressed="${state[questionSetting]}" class="px-3.5 py-2.5 rounded-2xl border text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${
                  state[questionSetting]
                    ? 'bg-pastelMint-50 border-pastelMint-300 text-emerald-800'
                    : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                }">
                  <span>🔀</span>
                  <span>Đảo câu: ${state[questionSetting] ? 'Bật' : 'Tắt'}</span>
                </button>
                <button type="button" onclick="toggleQuizShuffle('${optionSetting}')" aria-pressed="${state[optionSetting]}" class="px-3.5 py-2.5 rounded-2xl border text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${
                  state[optionSetting]
                    ? 'bg-pastelBlue-50 border-pastelBlue-300 text-sky-800'
                    : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                }">
                  <span>🎲</span>
                  <span>Đảo A/B/C/D: ${state[optionSetting] ? 'Bật' : 'Tắt'}</span>
                </button>
              <button onclick="openAddTestModal('${skill}')" class="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-pastelBlue-300 to-pastelPink-300 hover:from-pastelBlue-400 hover:to-pastelPink-400 text-slate-800 hover:text-white font-display font-bold text-xs sm:text-sm shadow-sm transition flex items-center gap-2">
                <span>＋</span><span>Thêm đề mới</span>
              </button>
            </div>
          </div>

          ${tests.length === 0 ? `
            <!-- Clean Empty State -->
            <div class="bg-white rounded-3xl p-10 sm:p-14 border border-dashed border-slate-200 shadow-card text-center space-y-4">
              <div class="w-16 h-16 mx-auto rounded-3xl bg-slate-50 border border-slate-100 flex items-center justify-center text-3xl">
                ${icon}
              </div>
              <div class="space-y-1.5">
                <h3 class="font-display font-bold text-xl text-slate-700">Chưa có đề thi ${shortName} nào được thêm.</h3>
                <p class="text-sm text-slate-500 max-w-md mx-auto">
                  Nhấn nút <strong>+ Thêm đề mới</strong> để nhập câu hỏi trắc nghiệm (A/B/C/D), đáp án đúng${isReading ? ' và đoạn văn đọc hiểu' : ' và đường dẫn/tệp âm thanh'}.
                </p>
              </div>
              <button onclick="openAddTestModal('${skill}')" class="mt-2 px-6 py-3 rounded-2xl bg-pastelBlue-100 hover:bg-pastelBlue-200 text-sky-800 font-bold text-sm transition inline-flex items-center gap-2">
                <span>＋</span><span>Thêm đề ${shortName} đầu tiên</span>
              </button>
            </div>
          ` : `
            <!-- Tests Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              ${tests.map(test => {
                const hasPassages = Array.isArray(test.passages) && test.passages.length > 0;
                const totalQCount = hasPassages
                  ? test.passages.reduce((acc, p) => acc + p.questions.length, 0)
                  : test.questions.length;
                const scoreKey = `${skill}_${test.id}_full`;
                const rec = state.quizScores[scoreKey] || state.quizScores[`${skill}_${test.id}`];

                return `
                  <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-100 shadow-card hover:shadow-soft hover:border-pastelBlue-200 transition flex flex-col justify-between gap-4">
                    <div class="space-y-3">
                      <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-3">
                          <span class="w-11 h-11 rounded-2xl bg-gradient-to-br from-pastelBlue-100 to-pastelPink-100 text-slate-700 font-display font-bold flex items-center justify-center text-lg">
                            ${icon}
                          </span>
                          <div>
                            <h3 class="font-display font-bold text-lg sm:text-xl text-slate-800">${escapeHtml(test.title)}</h3>
                            <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500 font-semibold mt-0.5">
                              <span>📝 ${totalQCount} câu hỏi</span>
                              <span>•</span>
                              <span>⏱️ ${test.duration} phút</span>
                              ${hasPassages ? `<span>•</span><span class="text-sky-600 font-bold">${test.passages.length} ${isReading ? 'Passages' : 'Parts'}</span>` : ''}
                            </div>
                          </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                          ${rec ? `<span class="px-2.5 py-1 rounded-xl bg-pastelMint-50 border border-pastelMint-200 text-emerald-700 text-xs font-extrabold">Full: ${formatScore(rec.best)}/10</span>` : ''}
                          ${!test.isBuiltin ? `<button onclick="deleteSkillTest('${skill}', '${test.id}')" title="Xóa đề này" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-pastelPink-50 transition text-xs">🗑️</button>` : ''}
                        </div>
                      </div>

                      ${hasPassages ? `
                        <div class="space-y-2 pt-1">
                          <div class="text-[11px] font-bold text-slate-400 uppercase">
                            ${isReading ? 'Luyện riêng từng Passage (10 câu/Passage • 15 phút):' : 'Luyện riêng từng Part:'}
                          </div>
                          <div class="grid ${isReading ? 'grid-cols-2' : 'grid-cols-1 sm:grid-cols-3'} gap-2">
                            ${test.passages.map(p => {
                              const pKey = `${skill}_${test.id}_p${p.id}`;
                              const pRec = state.quizScores[pKey];
                              const startNum = p.questions[0]?.origNum || 1;
                              const endNum = p.questions[p.questions.length - 1]?.origNum || p.questions.length;
                              return `
                                <button onclick="startSkillQuiz('${skill}', '${test.id}', ${p.id})" class="p-2.5 rounded-xl border text-left transition flex items-center justify-between gap-2 ${
                                  pRec
                                    ? 'bg-pastelMint-50/70 border-pastelMint-200 text-emerald-900 hover:bg-pastelMint-100'
                                    : 'bg-slate-50/80 border-slate-200/80 text-slate-700 hover:bg-pastelBlue-50 hover:border-pastelBlue-200'
                                }">
                                  <div class="min-w-0">
                                    <div class="text-xs font-extrabold truncate">${isReading ? `Passage ${p.id}` : `Part ${p.id}`}</div>
                                    <div class="text-[11px] text-slate-500 truncate">Câu ${startNum}–${endNum}</div>
                                  </div>
                                  <span class="shrink-0 text-[11px] font-extrabold ${pRec ? 'text-emerald-600' : 'text-sky-600'}">
                                    ${pRec ? `${formatScore(pRec.best)}đ` : `${p.questions.length} câu →`}
                                  </span>
                                </button>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      ` : ''}
                    </div>

                    <div class="flex items-center justify-between gap-2 pt-3 border-t border-slate-100">
                      <span class="text-xs font-semibold text-slate-400">

    function parseBulkIntoDraft() {
      const raw = (document.getElementById('bulk-questions-input')?.value || '').trim();
      if (!raw) {
        showToast('Vui lòng dán nội dung câu hỏi trước khi nạp.', 'warn');
        return;
      }

      const parsed = [];
      // 1. Try JSON first
      if (raw.startsWith('[')) {
        try {
          const arr = JSON.parse(raw);
          arr.forEach(item => {
            if (item && item.text && Array.isArray(item.options) && item.options.length >= 2) {
              const opts = [
                item.options[0] || '',
                item.options[1] || '',
                item.options[2] || '',
                item.options[3] || ''
              ];
              let ans = 0;
              if (typeof item.answer === 'number') ans = item.answer;
              else if (typeof item.answer === 'string') {
                const idx = ['A', 'B', 'C', 'D'].indexOf(item.answer.trim().toUpperCase());
                ans = idx >= 0 ? idx : 0;
              }
              parsed.push({ text: String(item.text), options: opts, answer: ans });
            }
          });
        } catch (e) {
          showToast('JSON không hợp lệ. Vui lòng kiểm tra lại cú pháp.', 'warn');
          return;
        }
      } else {
        // 2. Pipe-separated quick lines: Question | A: ... | B: ... | C: ... | D: ... | Ans: B
        const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
        lines.forEach(line => {
          const parts = line.split('|').map(p => p.trim());
          if (parts.length >= 5) {
            const qText = parts[0];
            const cleanOpt = s => (s || '').replace(/^[A-Da-d][\.\:\)]\s*/, '').trim();
            const opts = [cleanOpt(parts[1]), cleanOpt(parts[2]), cleanOpt(parts[3]), cleanOpt(parts[4])];
            let ans = 0;
            if (parts[5]) {
              const m = parts[5].match(/([A-Da-d])/);
              if (m) ans = ['A', 'B', 'C', 'D'].indexOf(m[1].toUpperCase());
            }
            parsed.push({ text: qText, options: opts, answer: Math.max(0, ans) });
          }
        });
      }

      if (parsed.length === 0) {
        showToast('Không nhận diện được câu hỏi nào. Hãy kiểm tra lại định dạng.', 'warn');
        return;
      }

      modalDraftQuestions = parsed;
      renderDraftQuestionRows();
      switchAddQuestionMode('form');
      showToast(`Đã nạp thành công ${parsed.length} câu hỏi!`, 'success');
    }

    function saveNewSkillTest(skill) {

      const title = (document.getElementById('new-test-title')?.value || '').trim();

      if (!title) {
        showToast('Vui lòng nhập tên đề thi.', 'warn');
        return;
      }

      const validQuestions = modalDraftQuestions.filter(q => q.text.trim() && q.options.some(o => o.trim()));
      if (validQuestions.length === 0) {
        showToast('Vui lòng nhập ít nhất 1 câu hỏi có nội dung và đáp án.', 'warn');
        return;
      }

      const id = 'test_' + Date.now();
      const newTest = {
        id,
        title,
        duration,
        questions: validQuestions
      };

      if (skill === 'reading') {
        newTest.passage = (document.getElementById('new-test-passage')?.value || '').trim();

    /* =========================================================================
       13. TABS 2 & 3: MULTIPLE-CHOICE QUIZ RUNNER (READING & LISTENING)
       ========================================================================= */

    function startSkillQuiz(skill, testId = null, passageId = null) {
      const allTests = testId === null;
      const tests = getTestsForSkill(skill).filter(test => allTests || test.id === testId);
      if (!tests.length) return;

      const isReading = skill === 'reading';
      const shouldShuffle = isReading ? state.shufflePassageQuestions : state.shuffleListeningQuestions;
      const shouldShuffleOpts = isReading ? state.shuffleReadingOptions : state.shuffleListeningOptions;
      const questions = tests.flatMap((test, testIndex) => {
        const sections = test.passages?.length
          ? test.passages
          : [{ id: null, title: '', questions: test.questions }];
        return sections
          .filter(section => passageId === null || section.id === Number(passageId))
          .flatMap(section => {
            const sectionQuestions = section.questions.map((question, index) => ({
              ...question,
              origNum: question.origNum || index + 1
            }));
            const ordered = shouldShuffle ? shuffleArray(sectionQuestions) : sectionQuestions;
            return ordered.map(question => ({
              ...(shouldShuffleOpts ? shuffleQuestionOptions(question) : question),
              testIndex,
              passageId: section.id,
              passageTitle: section.title,
              passageQuestionCount: section.questions.length
            }));
          });
      });
      if (!questions.length) return;

      cleanupActiveSessions();
      playSound('click');

      const test = tests[0];
      const skillName = isReading ? 'Reading' : 'Listening';
      const sectionName = isReading ? 'Passage' : 'Part';
      const durationMinutes = passageId === null ? tests.reduce((sum, item) => sum + Number(item.duration), 0) : 15;
      let sessionLabel = test.title;
      let scoreKey = `${skill}_${test.id}_full`;
      if (allTests) {
        sessionLabel = `Tất cả ${skillName} • ${tests.length} bộ đề`;
        scoreKey = `${skill}_all_tests`;
      } else if (passageId !== null) {
        sessionLabel = `${test.title} • ${sectionName} ${passageId}`;
        scoreKey = `${skill}_${test.id}_p${passageId}`;
      } else if (test.passages?.length) {
        sessionLabel = `${test.title} • Full (${questions.length} câu)`;
      }

      state.activeQuiz = {
        skill,
        test,
        tests,
        allTests,
        audioTestIndex: 0,
        passageId,
        sessionLabel,
        scoreKey,
        questions,
        isShuffled: shouldShuffle,
        isOptionsShuffled: shouldShuffleOpts,
        answers: {},
        currentQuestionIndex: 0,
        timeRemaining: durationMinutes * 60,
        isPaused: false,
        timerId: null,
        submitted: false,
        scoreCount: 0,
        score10: 0
      };

      renderApp();
      startQuizTimer();
    }

    function startQuizTimer() {
      const quiz = state.activeQuiz;
      if (!quiz) return;
      if (quiz.timerId) clearInterval(quiz.timerId);

      quiz.timerId = setInterval(() => {
        if (!state.activeQuiz || state.activeQuiz.submitted || state.activeQuiz.isPaused) return;
        if (state.activeQuiz.timeRemaining > 0) {
          state.activeQuiz.timeRemaining--;
          const el = document.getElementById('quiz-timer-display');
          if (el) el.textContent = formatTime(state.activeQuiz.timeRemaining);
          if (state.activeQuiz.timeRemaining === 0) {
            showToast('Hết giờ làm bài! Hệ thống tự động nộp bài.', 'warn');
            submitSkillQuiz(true);
          }
        }
      }, 1000);
    }

    function toggleQuizPause() {
      if (!state.activeQuiz || state.activeQuiz.submitted) return;
      state.activeQuiz.isPaused = !state.activeQuiz.isPaused;
      playSound('click');
      renderApp();
    }

    function selectQuizAnswer(qIdx, optIdx) {
      if (!state.activeQuiz || state.activeQuiz.submitted) return;
      state.activeQuiz.answers[qIdx] = optIdx;
      playSound('click');

    function jumpToQuizQuestion(qIdx) {
      if (!state.activeQuiz) return;

      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });

    function attachRuntimeAudio(input) {
      const file = input.files && input.files[0];
      if (!file || !state.activeQuiz) return;
      const url = URL.createObjectURL(file);
      const quiz = state.activeQuiz;
      sessionAudioMap[quiz.tests[quiz.audioTestIndex].id] = url;
      renderApp();
      showToast(`Đã tải file nghe: ${file.name}`, 'success');
    }

    function submitSkillQuiz(force = false) {
      const quiz = state.activeQuiz;
      if (!quiz || quiz.submitted) return;

      const answeredCount = Object.keys(quiz.answers).length;
      const total = quiz.questions.length;

      const doSubmit = () => {
        if (quiz.timerId) clearInterval(quiz.timerId);
        let correct = 0;
        quiz.questions.forEach((q, idx) => {
          if (quiz.answers[idx] === q.answer) correct++;
        });
        quiz.submitted = true;
        quiz.scoreCount = correct;
        quiz.score10 = total > 0 ? (correct / total) * 10 : 0;

        const key = quiz.scoreKey || `${quiz.skill}_${quiz.test.id}`;
        const prev = state.quizScores[key];
        state.quizScores[key] = {
          latest: quiz.score10,
          best: prev ? Math.max(prev.best, quiz.score10) : quiz.score10,
          total
        };
        saveQuizScores();
        playSound('complete');
        renderApp();
      };

      if (!force && answeredCount < total) {
        showConfirmModal({
          title: 'Nộp bài ngay?',
          message: `Bạn mới trả lời ${answeredCount}/${total} câu hỏi. Bạn có chắc muốn nộp bài và chấm điểm không?`,
          confirmText: 'Nộp bài',
          onConfirm: doSubmit
        });
      } else {
        doSubmit();
      }
    }

    function exitSkillQuiz() {
      if (state.activeQuiz && !state.activeQuiz.submitted) {
        showConfirmModal({
          title: 'Thoát khỏi bài làm?',
          message: 'Các câu trả lời chưa nộp sẽ bị mất.',
          confirmText: 'Thoát',
          danger: true,
          onConfirm: () => {
            cleanupActiveSessions();
            renderApp();
          }
        });
      } else {
        cleanupActiveSessions();
        renderApp();
      }
    }

    function selectQuizAudioTest(index) {
      const quiz = state.activeQuiz;
      if (!quiz || !quiz.tests[index]) return;
      quiz.audioTestIndex = index;
      renderApp();
    }

    function renderQuizRunner(root) {
      const quiz = state.activeQuiz;
      const { skill, test, questions, answers, submitted } = quiz;
      const isReading = skill === 'reading';
      const audioTest = quiz.tests[quiz.audioTestIndex];
      const audioSrc = sessionAudioMap[audioTest.id] || audioTest.audioUrl || '';
      const oldAudio = root.querySelector('#quiz-audio');
      const sameAudio = oldAudio && oldAudio.dataset.testId === audioTest.id && oldAudio.getAttribute('src') === audioSrc;
      const playback = sameAudio ? { time: oldAudio.currentTime, playing: !oldAudio.paused && !oldAudio.ended } : null;
      const navigatorScroll = root.querySelector('#quiz-question-nav')?.scrollTop ?? 0;
      const letters = ['A', 'B', 'C', 'D'];

      root.innerHTML = `
        <div class="space-y-5 animate-fade-up">
          <!-- Top Quiz Bar -->
          <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-card flex flex-wrap items-center justify-between gap-3 sticky top-[70px] z-20">
            <div class="flex items-center gap-3">
              <button onclick="exitSkillQuiz()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-pastelPink-100 text-slate-600 hover:text-rose-600 text-xs font-bold transition">← Danh sách</button>
              <div>
                <h2 class="font-display font-bold text-base sm:text-lg text-slate-800">${escapeHtml(quiz.sessionLabel || test.title)}</h2>
                <p class="text-xs text-slate-400 font-semibold">
                  ${isReading ? '📖 Kỹ năng Đọc' : '🎧 Kỹ năng Nghe'} • ${questions.length} câu ${quiz.isShuffled ? '• 🔀 Đã đảo câu' : ''} ${quiz.isOptionsShuffled ? '• 🎲 Đã đảo A/B/C/D' : ''}
                </p>
              </div>
            </div>

            <div class="flex items-center gap-2.5 ml-auto">
              ${submitted ? `
                <div class="px-4 py-2 rounded-xl bg-pastelMint-50 border border-pastelMint-200 text-emerald-700 font-display font-extrabold text-sm sm:text-base">
                  Kết quả: ${quiz.scoreCount}/${questions.length} (${formatScore(quiz.score10)}/10đ)
                </div>
                <button onclick="${quiz.allTests ? `startSkillQuiz('${skill}')` : `startSkillQuiz('${skill}', '${test.id}', ${quiz.passageId})`}" class="px-4 py-2 rounded-xl bg-pastelBlue-100 hover:bg-pastelBlue-200 text-sky-800 text-xs sm:text-sm font-bold transition">🔄 ${quiz.isShuffled || quiz.isOptionsShuffled ? 'Đảo đề & làm lại' : 'Làm lại'}</button>
              ` : `
                <div class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200">
                  <span>⏱️</span>
                  <span id="quiz-timer-display" class="font-display font-extrabold text-base tabular-nums text-slate-700">${formatTime(quiz.timeRemaining)}</span>
                  <button onclick="toggleQuizPause()" class="ml-1 px-2 py-0.5 rounded-lg bg-white border border-slate-200 text-xs font-bold text-slate-600">
                    ${quiz.isPaused ? '▶️' : '⏸️'}
                  </button>
                </div>
                <button onclick="submitSkillQuiz(false)" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-pastelBlue-400 to-pastelPink-400 text-white text-xs sm:text-sm font-bold shadow-sm hover:opacity-95 transition">
                  Nộp bài
                </button>
              `}
            </div>
          </div>

          <!-- Split Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- Left Column: Passage / Audio + Question Navigator -->
            <div class="lg:col-span-4 space-y-4 lg:sticky lg:top-[155px]">
              ${isReading ? (
                !quiz.allTests && test.passage ? `
                  <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-card max-h-[52vh] overflow-y-auto space-y-2">
                    <div class="text-xs font-extrabold text-sky-600 uppercase">📖 Đoạn văn đọc hiểu</div>
                    <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-line">${escapeHtml(test.passage)}</div>
                  </div>
                ` : ''
              ) : `
                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-card space-y-3">
                  <div class="text-xs font-extrabold text-rose-500 uppercase">🎧 Trình phát âm thanh</div>
                  ${quiz.allTests ? `
                    <label for="quiz-audio-test" class="block text-xs font-bold text-slate-600">Chọn đề để nghe</label>
                    <select id="quiz-audio-test" onchange="selectQuizAudioTest(Number(this.value))" class="w-full rounded-xl border border-slate-200 bg-white p-2 text-sm text-slate-700">
                      ${quiz.tests.map((item, index) => `<option value="${index}" ${index === quiz.audioTestIndex ? 'selected' : ''}>${escapeHtml(item.title)}</option>`).join('')}
                    </select>
                  ` : ''}
                  ${audioSrc ? `
                    <audio id="quiz-audio" data-test-id="${escapeHtml(audioTest.id)}" controls class="w-full rounded-xl" src="${escapeHtml(audioSrc)}">Trình duyệt không hỗ trợ phát audio.</audio>
                  ` : `
                    <div class="p-4 rounded-xl bg-slate-50 border border-dashed border-slate-200 text-center space-y-2">
                      <p class="text-xs text-slate-500 font-semibold">Chưa có tệp âm thanh được gắn cho đề này.</p>
                      <label class="inline-block px-3.5 py-2 rounded-xl bg-pastelBlue-100 hover:bg-pastelBlue-200 text-sky-800 text-xs font-bold cursor-pointer transition">
                        📂 Chọn file MP3/WAV từ máy
                        <input type="file" accept="audio/*" onchange="attachRuntimeAudio(this)" class="hidden" />
                      </label>
                    </div>
                  `}
                </div>
              `}

              <!-- Question Number Navigator Grid -->
              <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-card space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-slate-500 uppercase">Bảng câu hỏi</span>
                  <span class="text-xs font-bold text-slate-400">Đã chọn: ${Object.keys(answers).length}/${questions.length}</span>
                </div>
                <div id="quiz-question-nav" class="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2 max-h-[30vh] overflow-y-auto">
                  ${questions.map((q, idx) => {
                    const userAns = answers[idx];
                    const isAnswered = userAns !== undefined;
                    let btnCls = 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100';
                    if (submitted) {
                      btnCls = userAns === q.answer
                        ? 'bg-pastelMint-100 text-emerald-800 border-pastelMint-300'
                        : 'bg-pastelPink-100 text-rose-700 border-pastelPink-300';
                    } else if (isAnswered) {
                      btnCls = 'bg-pastelBlue-100 text-sky-800 border-pastelBlue-300';
                    }
                    return `<button onclick="jumpToQuizQuestion(${idx})" class="h-9 rounded-xl border text-xs font-extrabold transition ${btnCls}">${idx + 1}</button>`;
                  }).join('')}
                </div>
              </div>
            </div>

            <!-- Right Column: Multiple Choice Questions List (Grouped by Passage if available) -->
            <div class="lg:col-span-8 space-y-4">
              ${questions.map((q, qIdx) => {
                const userAns = answers[qIdx];
                const questionTest = quiz.tests[q.testIndex];
                const startsTest = qIdx === 0 || questions[qIdx - 1].testIndex !== q.testIndex;
                const showPassageHeader = q.passageId !== null && (startsTest || questions[qIdx - 1].passageId !== q.passageId);

                return `
                  ${quiz.allTests && startsTest ? `
                    <section class="rounded-2xl bg-white p-5 border border-slate-100 shadow-card space-y-2">
                      <h3 class="font-display font-extrabold text-base text-slate-800">${escapeHtml(questionTest.title)}</h3>
                      ${isReading && questionTest.passage ? `<div class="text-sm text-slate-700 leading-relaxed whitespace-pre-line">${escapeHtml(questionTest.passage)}</div>` : ''}
                      ${!isReading ? `<button type="button" onclick="selectQuizAudioTest(${q.testIndex}); document.getElementById('quiz-audio-test').scrollIntoView({block: 'center'})" class="text-sm font-bold text-sky-700">🎧 Chọn âm thanh đề này</button>` : ''}
                    </section>
                  ` : ''}
                  ${showPassageHeader ? `
                    <div class="px-4 py-3 rounded-2xl bg-gradient-to-r from-pastelBlue-100/80 to-pastelPink-100/60 border border-pastelBlue-200/80 flex items-center justify-between gap-2 ${qIdx > 0 ? 'mt-6' : ''}">
                      <span class="font-display font-bold text-sm sm:text-base text-slate-800">📑 ${escapeHtml(q.passageTitle)}</span>
                      <span class="text-[11px] font-bold text-sky-700 bg-white/80 px-2.5 py-0.5 rounded-full">${q.passageQuestionCount} câu${quiz.isShuffled ? ' (đã đảo thứ tự)' : ''}</span>
                    </div>
                  ` : ''}

                  <div id="quiz-q-${qIdx}" class="bg-white rounded-2xl p-5 border border-slate-100 shadow-card space-y-3.5">
                    <div class="flex items-start justify-between gap-2">
                      <h3 class="font-bold text-sm sm:text-base text-slate-800 leading-snug">
                        <span class="inline-block px-2 py-0.5 rounded-lg bg-pastelBlue-50 text-sky-700 text-xs font-extrabold mr-1.5">Câu ${qIdx + 1}</span>
                        ${escapeHtml(q.text)}
                        ${q.translation ? `<span lang="vi" class="quiz-question-translation block mt-1.5 text-sm font-normal text-slate-600">${escapeHtml(q.translation.text)}</span>` : ''}
                      </h3>
                      <div class="flex items-center gap-1.5 shrink-0">
                        ${(submitted || (!isReading && quiz.isShuffled)) && q.origNum ? `<span class="text-[11px] font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100">Gốc #${q.origNum}</span>` : ''}
                        ${submitted ? (
                          userAns === q.answer
                            ? `<span class="text-xs font-bold text-emerald-600 bg-pastelMint-50 px-2 py-1 rounded-lg">✓ Đúng</span>`
                            : `<span class="text-xs font-bold text-rose-600 bg-pastelPink-50 px-2 py-1 rounded-lg">✕ Sai</span>`
                        ) : ''}
                      </div>
                    </div>

                    <div class="grid grid-cols-1 gap-2">
                      ${q.options.map((opt, optIdx) => {
                        if (!opt || !opt.trim()) return '';
                        const isSelected = userAns === optIdx;
                        const isCorrect = q.answer === optIdx;

                        let optStyle = 'bg-slate-50/70 border-slate-200 text-slate-700 hover:bg-pastelBlue-50/60 hover:border-pastelBlue-200';
                        if (submitted) {
                          if (isCorrect) {
                            optStyle = 'bg-pastelMint-100 border-pastelMint-300 text-emerald-900 font-bold';
                          } else if (isSelected && !isCorrect) {
                            optStyle = 'bg-pastelPink-100 border-pastelPink-300 text-rose-900 font-bold';
                          } else {
                            optStyle = 'bg-slate-50/40 border-slate-100 text-slate-400';
                          }
                        } else if (isSelected) {
                          optStyle = 'bg-pastelBlue-100 border-pastelBlue-300 text-sky-900 font-bold ring-1 ring-pastelBlue-200';
                        }

                        return `
                          <button type="button" ${submitted ? 'disabled' : ''} onclick="selectQuizAnswer(${qIdx}, ${optIdx})" class="w-full text-left px-4 py-3 rounded-xl border text-sm transition flex items-center gap-3 ${optStyle}">
                            <span class="w-6 h-6 rounded-lg bg-white/90 border border-slate-200/70 flex items-center justify-center text-xs font-extrabold shrink-0">${letters[optIdx]}</span>
                            <span class="flex-1">
                              <span class="block">${escapeHtml(opt)}</span>
                              ${q.translation?.options[optIdx] ? `<span lang="vi" class="quiz-option-translation block mt-0.5 text-xs font-normal opacity-80">${escapeHtml(q.translation.options[optIdx])}</span>` : ''}
                            </span>
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      root.querySelector('#quiz-question-nav').scrollTop = navigatorScroll;
      if (playback) {
        const player = root.querySelector('#quiz-audio');
        const restorePlayback = () => {
          player.currentTime = playback.time;
          if (playback.playing) player.play().catch(() => {});
        };
        if (player.readyState > 0) restorePlayback();
        else player.addEventListener('loadedmetadata', restorePlayback, { once: true });
      }
    }

    /* =========================================================================
       14. TAB 4: WRITING — MINIMALIST PLACEHOLDER
       ========================================================================= */

    function renderWritingPlaceholder(root) {
      root.innerHTML = `
        <div class="max-w-2xl mx-auto py-8 animate-fade-up">
          <div class="bg-white rounded-3xl p-10 sm:p-14 border border-slate-100 shadow-soft text-center space-y-4">
            <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-pastelPink-100 to-pastelBlue-100 flex items-center justify-center text-4xl shadow-sm">
              ✍️
            </div>
            <h2 class="font-display font-bold text-2xl text-slate-800">Kỹ năng Viết</h2>
            <p class="text-sm sm:text-base text-slate-500 font-medium leading-relaxed">
              Kỹ năng Viết — Giao diện và cách trình bày sẽ được cập nhật sau.
            </p>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       15. APP INITIALIZATION
       ========================================================================= */

    function initApp() {
      loadPersistedData();
      updateSfxUI();

      if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      renderApp();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
